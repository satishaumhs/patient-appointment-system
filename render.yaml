services:
  - type: web
    name: patient-appointment-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        value: https://patient-appointment-client.onrender.com

  - type: web
    name: patient-appointment-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://patient-appointment-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
